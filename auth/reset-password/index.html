<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset SarifPro Password</title>
    <link rel="stylesheet" href="../auth.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <p class="brand">SarifPro</p>
        <h1>Reset password</h1>
        <p id="intro">Enter a new password for your SarifPro account.</p>

        <form id="reset-form" class="hidden">
          <label>
            New password
            <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required />
          </label>
          <label>
            Confirm new password
            <input id="confirm-password" name="confirm-password" type="password" minlength="8" autocomplete="new-password" required />
          </label>
          <button id="submit-button" type="submit">Update Password</button>
        </form>

        <div id="message" class="message hidden" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./reset-password.js"></script>
  </body>
</html>
